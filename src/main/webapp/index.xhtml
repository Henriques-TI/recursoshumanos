<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core" 
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Departamento</title>

        <h:outputStylesheet name="stilo.css" library="css"/>


    </h:head>


    <h:body>
        <header class="topo">
            Topo
        </header>
        <nav class="menu">Menu

            <h:form>
                <h:commandButton value="Listar Deptos" action="departamento" />
                <h:commandButton value="Listar Funcionario" action="funcionario" />
            </h:form>

        </nav>
        <section class="banner"></section>
        <section class="conteudo">Cadastro
            <h:form styleClass="form-azul">
                <h:panelGrid columns="2">

                    <h:outputLabel value="Nome" />
                    <a href="../../../../sistema_t/src/main/webapp/index.xhtml"></a>
                    <h:inputText value="#{departamentoBean.departamento.nome}" />

                    <h:outputLabel value="Descricao" />
                    <h:inputText value="#{departamentoBean.departamento.descricao}" />

                    <h:commandButton value="Salvar"
                                     action="#{departamentoBean.guardarDados}"
                                     styleClass="botao-azul"/>
                </h:panelGrid>

            </h:form>


        </section>
        <footer class="rodape">Rodapé</footer>
    </h:body>
</html>
